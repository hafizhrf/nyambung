services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public HTTPS origin}
      DATABASE_PATH: /app/data/nyambung.sqlite
      MABAR_ENABLED: ${MABAR_ENABLED:-false}
      DISCORD_ENABLED: ${DISCORD_ENABLED:-false}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_BETA_GUILD_ID: ${DISCORD_BETA_GUILD_ID:-}
      DISCORD_GUILD_IDS: ${DISCORD_GUILD_IDS:-}
