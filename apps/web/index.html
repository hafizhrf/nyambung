<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="theme-color" content="#08090d"/>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const embedded = window.parent !== window || !!window.opener || /^\d+\.discordsays\.com$/.test(location.hostname) || params.get('platform') === 'mobile';
        const context = embedded && params.has('frame_id') && params.has('instance_id') ? 'discord' : 'browser';
        let crt = 'on';
        try { if (localStorage.getItem('nyambung-crt') === 'off') crt = 'off'; } catch {}
        document.documentElement.dataset.theme = 'arcade';
        document.documentElement.dataset.crt = crt;
        document.documentElement.dataset.themeContext = context;
        document.documentElement.dataset.activityPlatform = context === 'discord' ? params.get('platform') || 'desktop' : 'browser';
        document.querySelector('meta[name="theme-color"]').content = '#08090d';
      })();
    </script>
    <title>Nyambung | Game Kata Harian</title>
    <meta name="description" content="Cari satu kata yang menghubungkan petunjuk. Main Daily hari ini, buka arsip Daily, atau coba mode acak."/>
    <meta property="og:type" content="website"/>
    <meta property="og:locale" content="id_ID"/>
    <meta property="og:url" content="https://nyambung.web.id/"/>
    <meta property="og:title" content="Nyambung | Game Kata Harian"/>
    <meta property="og:description" content="Cari satu kata yang menghubungkan petunjuk. Main Daily hari ini, buka arsip Daily, atau coba mode acak."/>
    <meta name="twitter:card" content="summary"/>
    <meta name="twitter:title" content="Nyambung | Game Kata Harian"/>
    <meta name="twitter:description" content="Cari satu kata yang menghubungkan petunjuk. Main Daily hari ini, buka arsip Daily, atau coba mode acak."/>
    <link rel="canonical" href="https://nyambung.web.id/"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
